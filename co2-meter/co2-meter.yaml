# CO2-meter voor Home Assistant
# Hardware: Waveshare ESP32-S3-Touch-AMOLED-1.32 (CO5300 QSPI, CST820 touch)
#           + Sensirion SCD41 (CO2, temperatuur, vochtigheid) via I2C
#
# Pinnen komen uit de productafbeelding van de Waveshare-winkel (display CO5300,
# touch CST820). SCD41 hangt aan de GPIO1 (SCL) en GPIO2 (SDA)-pinnen van de 12-pins header.

substitutions:
  name: co2-meter
  friendly_name: CO2 Meter

  # --- Display (QSPI, CO5300) ---
  lcd_cs: GPIO10
  lcd_clk: GPIO11
  lcd_d0: GPIO12
  lcd_d1: GPIO13
  lcd_d2: GPIO14
  lcd_d3: GPIO15
  lcd_reset: GPIO8
  # LCD_TE = GPIO9 (tearing-signaal, niet gebruikt)

  # --- Touch (CST820; deelt I2C-bus met de audiocodec ES8311) ---
  touch_sda: GPIO47
  touch_scl: GPIO48
  touch_int: GPIO6
  touch_reset: GPIO7

  # --- SCD41 op de header: pin GPIO1 = SCL, GPIO2 = SDA ---
  sensor_sda: GPIO2
  sensor_scl: GPIO1

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - ui.h
  on_boot:
    priority: -100
    then:
      - delay: 45s   # wacht op eerste SCD41-meting
      - script.execute: record_history

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"
    password: !secret ap_password

captive_portal:

i2c:
  - id: bus_sensor
    sda: ${sensor_sda}
    scl: ${sensor_scl}
    frequency: 100kHz
  - id: bus_touch
    sda: ${touch_sda}
    scl: ${touch_scl}
    frequency: 400kHz

spi:
  id: qspi_bus
  type: quad
  clk_pin: ${lcd_clk}
  data_pins:
    - ${lcd_d0}
    - ${lcd_d1}
    - ${lcd_d2}
    - ${lcd_d3}

sensor:
  - platform: scd4x
    i2c_id: bus_sensor
    update_interval: 10s
    # Meter op ~100 m hoogte; pas aan of zet op 0 en gebruik ambient pressure
    altitude_compensation: 0m
    automatic_self_calibration: true
    co2:
      id: co2_ppm
      name: "CO2"
    temperature:
      id: temp_c
      name: "Temperatuur"
    humidity:
      id: hum_pct
      name: "Luchtvochtigheid"

  - platform: wifi_signal
    name: "WiFi signaal"
    update_interval: 60s
    entity_category: diagnostic

# Handmatige kalibratie vanuit Home Assistant (buiten, 400 ppm)
button:
  - platform: template
    name: "Kalibreer op 420 ppm"
    entity_category: config
    on_press:
      - scd4x.perform_forced_calibration:
          value: 420
  - platform: restart
    name: "Herstart"
    entity_category: config

output:
  - platform: template
    id: dummy_out
    type: float
    write_action: []

light:
  # Schermhelderheid regelbaar vanuit HA (AMOLED: lage helderheid spaart pixels)
  - platform: monochromatic
    name: "Scherm"
    output: dummy_out
    id: screen_light
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    on_state:
      - lambda: |-
          auto &cv = id(screen_light).current_values;
          float b = cv.is_on() ? cv.get_brightness() : 0.0f;
          id(amoled).set_brightness((uint8_t) (b * 255));

script:
  # Historie voor de grafieken: elke 5 minuten een punt (12 uur = 144 punten)
  - id: record_history
    then:
      - lambda: |-
          ui::co2_hist.push(id(co2_ppm).state);
          ui::temp_hist.push(id(temp_c).state);
  # Scherm 30 s fel na aanraking, daarna gedimd (spaart het AMOLED-paneel)
  - id: wake_screen
    mode: restart
    then:
      - light.turn_on:
          id: screen_light
          brightness: 100%
      - delay: 30s
      - light.turn_on:
          id: screen_light
          brightness: 30%

interval:
  - interval: 5min
    then:
      - script.execute: record_history

display:
  - platform: mipi_spi
    id: amoled
    model: CO5300
    spi_id: qspi_bus
    bus_mode: quad
    dimensions:
      width: 466
      height: 466
    cs_pin: ${lcd_cs}
    reset_pin: ${lcd_reset}
    update_interval: 5s
    pages:
      - id: page_overview
        lambda: |-
          ui::Fonts f{id(font_huge), id(font_big), id(font_med), id(font_small), id(font_tiny)};
          ui::draw_overview(it, f, id(co2_ppm).state, id(temp_c).state, id(hum_pct).state);
      - id: page_co2
        lambda: |-
          ui::Fonts f{id(font_huge), id(font_big), id(font_med), id(font_small), id(font_tiny)};
          ui::draw_co2_page(it, f, id(co2_ppm).state);
      - id: page_temp
        lambda: |-
          ui::Fonts f{id(font_huge), id(font_big), id(font_med), id(font_small), id(font_tiny)};
          ui::draw_temp_page(it, f, id(temp_c).state);

touchscreen:
  - platform: cst816
    id: touch
    i2c_id: bus_touch
    interrupt_pin: ${touch_int}
    reset_pin: ${touch_reset}
    on_release:
      # Gedimd scherm: eerste tik maakt het alleen wakker; daarna wisselt elke tik van pagina
      - if:
          condition:
            lambda: 'return id(screen_light).current_values.get_brightness() > 0.5f;'
          then:
            - display.page.show_next: amoled
            - component.update: amoled
      - script.execute: wake_screen

font:
  - file: "gfonts://Roboto@700"
    id: font_huge
    size: 120
    glyphs: "0123456789-"
  - file: "gfonts://Roboto@700"
    id: font_big
    size: 76
    glyphs: "0123456789.-"
  - file: "gfonts://Roboto@500"
    id: font_med
    size: 30
    glyphs: &glyphs " !%()+,-./0123456789:°ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
  - file: "gfonts://Roboto"
    id: font_small
    size: 22
    glyphs: *glyphs
  - file: "gfonts://Roboto"
    id: font_tiny
    size: 18
    glyphs: *glyphs
