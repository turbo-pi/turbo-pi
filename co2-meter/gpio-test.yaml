# Tijdelijke testconfig om te vinden welke draad van de kabel GPIO1 en GPIO2 is.
# Flash dit, open http://gpio-test.local en schakel de twee switches aan/uit
# terwijl je de draden met een multimeter meet. Daarna weer co2-meter.yaml flashen.
esphome:
  name: gpio-test

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80

switch:
  - platform: gpio
    pin: GPIO1
    name: "Test GPIO1"
  - platform: gpio
    pin: GPIO2
    name: "Test GPIO2"
