esphome:
  name: t-display-co2
  friendly_name: T-Display CO2 Meter

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  # GPIO43/44 zijn normaal UART0 (TX/RX); die gebruiken we voor I2C,
  # dus log via de ingebouwde USB-poort.
  hardware_uart: USB_SERIAL_JTAG

api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

time:
  - platform: homeassistant
    id: ha_time

i2c:
  sda: GPIO43
  scl: GPIO44
  scan: true
  frequency: 50kHz # SCD30 gebruikt clock stretching; lage snelheid is stabieler

sensor:
  - platform: scd30
    co2:
      name: "T-Display CO2"
      id: co2
      accuracy_decimals: 0
    temperature:
      name: "T-Display Temperatuur"
      id: temp
      accuracy_decimals: 1
    humidity:
      name: "T-Display Luchtvochtigheid"
      id: hum
      accuracy_decimals: 0
    update_interval: 10s
    automatic_self_calibration: true
    # altitude_compensation: 10m   # of: ambient_pressure_compensation: 1020mbar
    # temperature_offset: 2.0 °C   # SCD30 meet vaak te warm als hij dicht bij de ESP zit

# --- Display: LILYGO T-Display S3 (ST7789 170x320, 8-bit parallel) ---
spi:
  - id: oct_spi
    type: octal
    clk_pin: GPIO8 # WR
    data_pins: [GPIO39, GPIO40, GPIO41, GPIO42, GPIO45, GPIO46, GPIO47, GPIO48]

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "T-Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

# Display + LCD-voeding (GPIO15 moet hoog bij batterijgebruik)
switch:
  - platform: gpio
    pin: GPIO15
    id: lcd_power
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: gpio # rechter knop (BOOT) wisselt van pagina
    pin:
      number: GPIO0
      inverted: true
      mode: INPUT_PULLUP
    on_press:
      - display.page.show_next: main_display
      - component.update: main_display
  - platform: gpio # onderste knop: backlight aan/uit
    pin:
      number: GPIO14
      inverted: true
      mode: INPUT_PULLUP
    on_press:
      - light.toggle: backlight

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 64
  - file: "gfonts://Roboto"
    id: font_med
    size: 28
  - file: "gfonts://Roboto"
    id: font_small
    size: 16

color:
  - id: c_good
    hex: 00C853
  - id: c_warn
    hex: FFB300
  - id: c_bad
    hex: FF1744
  - id: c_temp
    hex: 40C4FF
  - id: c_grid
    hex: 404040

graph:
  - id: co2_graph
    sensor: co2
    duration: 1h
    width: 270
    height: 90
    x_grid: 10min
    y_grid: 200
    min_value: 400
    max_value: 2000
    line_thickness: 2
    border: false
    color: c_grid
  - id: temp_graph
    sensor: temp
    duration: 1h
    width: 270
    height: 90
    x_grid: 10min
    y_grid: 2.0
    min_range: 4
    line_thickness: 2
    border: false
    color: c_grid

display:
  - platform: mipi_spi
    model: t-display-s3
    id: main_display
    rotation: 270 # landscape, 320x170
    update_interval: 5s
    pages:
      # Pagina 1: grote CO2-waarde + temperatuur + CO2-grafiek
      - id: page_co2
        lambda: |-
          auto bad = id(c_bad); auto warn = id(c_warn); auto good = id(c_good);
          Color col = good;
          if (id(co2).has_state()) {
            if (id(co2).state > 1500) col = bad;
            else if (id(co2).state > 1000) col = warn;
          }
          it.fill(Color::BLACK);
          if (id(co2).has_state()) {
            it.printf(8, 0, id(font_big), col, "%.0f", id(co2).state);
            it.printf(150, 40, id(font_small), col, "ppm CO2");
          } else {
            it.print(8, 10, id(font_med), Color::WHITE, "Opwarmen...");
          }
          if (id(temp).has_state())
            it.printf(312, 2, id(font_med), id(c_temp), TextAlign::TOP_RIGHT, "%.1f°C", id(temp).state);
          if (id(hum).has_state())
            it.printf(312, 36, id(font_small), Color::WHITE, TextAlign::TOP_RIGHT, "%.0f%% RV", id(hum).state);
          it.graph(40, 70, id(co2_graph), col);
          it.printf(36, 70, id(font_small), Color::WHITE, TextAlign::TOP_RIGHT, "2000");
          it.printf(36, 152, id(font_small), Color::WHITE, TextAlign::TOP_RIGHT, "400");
      # Pagina 2: temperatuurgrafiek
      - id: page_temp
        lambda: |-
          it.fill(Color::BLACK);
          if (id(temp).has_state())
            it.printf(8, 0, id(font_big), id(c_temp), "%.1f°C", id(temp).state);
          if (id(hum).has_state())
            it.printf(312, 6, id(font_med), Color::WHITE, TextAlign::TOP_RIGHT, "%.0f%%", id(hum).state);
          it.graph(40, 70, id(temp_graph), id(c_temp));
          it.print(36, 70, id(font_small), Color::WHITE, TextAlign::TOP_RIGHT, "temp");
